<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>HeaderForge</title>
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon48.png" alt="" class="brand__logo" width="22" height="22" />
          <span class="brand__name">HeaderForge</span>
        </div>
        <div class="topbar__actions">
          <button
            id="pauseBtn"
            class="iconbtn"
            title="Pause all headers"
            aria-pressed="false"
          >
            <span class="iconbtn__glyph" data-icon="pause"></span>
          </button>
          <button id="themeBtn" class="iconbtn" title="Toggle theme">
            <span class="iconbtn__glyph" data-icon="theme"></span>
          </button>
        </div>
      </header>

      <!-- Paused banner -->
      <div id="pausedBanner" class="banner banner--paused" hidden>
        <span>All headers paused</span>
        <button id="resumeBtn" class="banner__action">Resume</button>
      </div>

      <!-- Error banner -->
      <div id="errorBanner" class="banner banner--error" hidden></div>

      <!-- Profile row: scrollable pill switcher; each pill has its own actions -->
      <section class="profilebar">
        <div class="profiles" id="profileStrip"><!-- pills injected --></div>
        <!-- Per-profile action menu (contents populated on open) -->
        <div id="profileMenu" class="menu" hidden></div>
      </section>

      <!-- Tabs -->
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="request" role="tab">
          Request <span class="tab__count" id="countRequest">0</span>
        </button>
        <button class="tab" data-tab="response" role="tab">
          Response <span class="tab__count" id="countResponse">0</span>
        </button>
        <button class="tab" data-tab="filters" role="tab">
          URL Filters <span class="tab__count" id="countFilters">0</span>
        </button>
      </nav>

      <!-- Panels -->
      <main class="content">
        <section class="panel is-active" data-panel="request">
          <div class="rows" id="requestRows"></div>
          <button class="addrow" data-add="request">+ Add request header</button>
          <div class="panel-tools">
            <button class="linkbtn" data-himport="request">Import headers…</button>
            <span class="panel-tools__sep">·</span>
            <button class="linkbtn" data-hexport="request">Export headers</button>
          </div>
        </section>

        <section class="panel" data-panel="response">
          <div class="rows" id="responseRows"></div>
          <button class="addrow" data-add="response">+ Add response header</button>
          <div class="panel-tools">
            <button class="linkbtn" data-himport="response">Import headers…</button>
            <span class="panel-tools__sep">·</span>
            <button class="linkbtn" data-hexport="response">Export headers</button>
          </div>
        </section>

        <section class="panel" data-panel="filters">
          <p class="hint">
            Limit this profile to URLs matching a regular expression. Leave empty
            to apply to every request.
          </p>
          <div class="rows" id="filterRows"></div>
          <button class="addrow" data-add="filter">+ Add URL filter</button>
        </section>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <span class="footer__hint">All profiles</span>
        <div class="footer__spacer"></div>
        <button id="exportBtn" class="footer__btn" title="Export all profiles as JSON">
          Export
        </button>
        <button id="importBtn" class="footer__btn" title="Import profiles from JSON">
          Import
        </button>
      </footer>

      <!-- Drag-to-resize grip (bottom-left, since the popup is anchored top-right) -->
      <div id="resizeGrip" class="resize-grip" title="Drag to resize"></div>
    </div>

    <input id="importFile" type="file" accept="application/json,.json" hidden />
    <input id="importHeadersFile" type="file" accept="application/json,.json" hidden />

    <script type="module" src="popup.js"></script>
  </body>
</html>
